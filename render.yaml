# Render Blueprint — https://render.com/docs/blueprint-spec
# Pour un service déjà créé manuellement, copiez Start Command + variables ci-dessous dans le dashboard.
services:
  - type: web
    name: backenda7na
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
